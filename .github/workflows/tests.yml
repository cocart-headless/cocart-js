name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: [20, 22]

    name: Node.js ${{ matrix.node-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  deno:
    runs-on: ubuntu-latest

    name: Deno

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Deno compatibility (core SDK)
        run: |
          deno eval "import { CoCart, MemoryStorage } from './dist/index.js'; const c = new CoCart('https://example.com', { storage: new MemoryStorage() }); console.log('core OK:', typeof c);"

      - name: Check Deno compatibility (deno adapter)
        run: |
          echo "{\"imports\":{\"@cocart/sdk\":\"$GITHUB_WORKSPACE/dist/index.js\"}}" > /tmp/deno-import-map.json
          deno eval --import-map=/tmp/deno-import-map.json "import { createClient } from '$GITHUB_WORKSPACE/dist/adapters/deno.js'; const c = createClient('https://example.com'); console.log('deno adapter OK:', typeof c);"
